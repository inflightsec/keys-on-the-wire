name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow ad-hoc runs from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      # Block unexpected outbound network from the runner. Start in `audit`
      # to collect the actual egress profile, then flip to `block` with a
      # concrete `allowed-endpoints` list once StepSecurity's insights show
      # what each job legitimately reaches.
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install hash-pinned dependencies
        run: |
          python -m pip install --upgrade pip
          # Both prod + dev deps are hash-pinned + wheels-only.
          # requirements-dev.lock is a superset of requirements.lock (it
          # includes the runtime deps too), so this single install covers
          # everything pytest + ruff need to run the test suite.
          # --require-hashes — refuses anything not hash-pinned (closes the
          #   transitive-dep substitution surface).
          # --only-binary :all: — refuses source distributions (Python's
          #   equivalent of npm --ignore-scripts).
          pip install --require-hashes --only-binary :all: -r requirements-dev.lock
          # Install the package itself in editable mode WITHOUT pulling deps
          # again (--no-deps respects the hash-pinned set we just installed).
          pip install --no-deps -e .

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff format --check)
        run: ruff format --check src tests

      - name: Type check (mypy)
        # mypy is configured in pyproject.toml [tool.mypy]. Catches a class
        # of bugs ruff doesn't see — None/Optional handling, type signature
        # drift, return-from-Any leaks at third-party boundaries.
        run: mypy --config-file pyproject.toml src

      - name: Test (pytest)
        env:
          # Keep tests deterministic — no real BWS calls, no real mitmproxy
          # CA generation. Anything that needs those should use a fixture.
          PYTHONDONTWRITEBYTECODE: '1'
        run: pytest -q --strict-markers --strict-config

  attacks:
    # Adversarial attack gallery (ADR-0043) as its own gate. These exploits
    # also run inside the `test` job; this dedicated job exists so the exfil
    # guarantee is a single required check that reads red the moment an attack
    # succeeds — or an `expected-leak` gets fixed without flipping (strict
    # xfail). See tests/attacks/README.md.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install hash-pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --only-binary :all: -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Attack gallery (exfil regression)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: pytest -m attacks -q --strict-markers --strict-config

  e2e-docker:
    # End-to-end test: build the image, stand up the proxy + an echo
    # upstream, prove the placeholder→real substitution happens on the
    # wire and that unbound destinations get denied. See
    # tests/docker-e2e/README.md for the test design.
    #
    # Independent of the unit-test matrix on purpose — Docker build adds
    # 60-90s and shouldn't gate the fast pytest jobs. Failures still
    # surface in this workflow's overall status, so PR merges are gated
    # by branch protection if you've configured this job as required.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Docker E2E harness
        run: bash tests/docker-e2e/run.sh

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f tests/docker-e2e/docker-compose.yml logs kow-init || true
          docker compose -f tests/docker-e2e/docker-compose.yml logs kow || true
          docker compose -f tests/docker-e2e/docker-compose.yml logs upstream || true

  e2e-setup:
    # Integration test for `avp setup --no-service`: build the wheel,
    # then provision a disposable Ubuntu container for real (useradd,
    # modes, chattr +a) and assert the end state with bats. Service
    # activation is out of scope by design — the unit FILE is asserted,
    # systemd is never started. See tests/setup-e2e/README.md.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: 'pip install --no-cache-dir --only-binary :all: build'

      - name: Run setup E2E harness
        run: bash tests/setup-e2e/run.sh

      - name: Dump container state on failure
        if: failure()
        run: docker logs avp-setup-e2e || true

  verify-lockfile:
    # Detect when pyproject.toml dependencies drift from either lockfile
    # without anyone re-running pip-compile. Cheap, runs in parallel.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: "Structural check — every pinned package must have --hash=sha256:"
        # Cheap, no network. Runs first so a hand-edited or hash-stripped
        # lockfile fails fast before we waste time on `uv pip compile`. Same
        # script the pre-commit hook runs locally — single source of truth.
        run: python3 scripts/check-lockfile-hashes.py

      - name: Install uv (faster than pip-compile)
        run: pip install uv

      - name: Re-compile both lockfiles into tempfiles (with 7-day cooldown)
        run: |
          # Supply-chain cooldown: refuse any package version released in the
          # last 7 days. Mirrors the npm/uv ecosystem-wide cooldown pattern.
          # If a malicious release is published, the 7-day window gives the
          # community time to detect + yank it before it lands in our lockfile.
          #
          # Same Python expression as scripts/check-lockfile-drift.sh — keeps
          # the CI gate and local pre-commit gate in exact byte agreement.
          # Time portion hardcoded to 00:00:00 so the cutoff is stable for
          # ~24h (security property unchanged; rounding only ever makes the
          # cutoff stricter, never weaker).
          CUTOFF=$(python3 -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(days=7)).strftime("%Y-%m-%dT00:00:00Z"))')
          echo "Cooldown cutoff: $CUTOFF"
          uv pip compile --universal --generate-hashes \
            --exclude-newer "$CUTOFF" \
            pyproject.toml -o /tmp/requirements.lock.fresh
          uv pip compile --universal --generate-hashes \
            --exclude-newer "$CUTOFF" \
            --extra dev \
            pyproject.toml -o /tmp/requirements-dev.lock.fresh

      - name: Diff against committed lockfiles
        run: |
          # Strip pip-compile header (timestamp + command line vary per run);
          # only the pinned deps + hashes should match.
          fail=0
          for lock in requirements.lock requirements-dev.lock; do
            sed '/^#/d' "$lock" > "/tmp/${lock}.committed.stripped"
            sed '/^#/d' "/tmp/${lock}.fresh" > "/tmp/${lock}.fresh.stripped"
            if ! diff -u "/tmp/${lock}.committed.stripped" "/tmp/${lock}.fresh.stripped"; then
              echo "::error::${lock} drift detected. Either"
              echo "::error::(a) pyproject.toml changed without regenerating ${lock}, or"
              echo "::error::(b) ${lock} pins a version younger than the 7-day cooldown window."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Regenerate locally with:"
            echo "::error::  CUTOFF=\$(python3 -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(days=7)).strftime(\"%Y-%m-%dT00:00:00Z\"))')"
            echo "::error::  uv pip compile --universal --generate-hashes --exclude-newer \"\$CUTOFF\" pyproject.toml -o requirements.lock"
            echo "::error::  uv pip compile --universal --generate-hashes --exclude-newer \"\$CUTOFF\" --extra dev pyproject.toml -o requirements-dev.lock"
            exit 1
          fi

  audit-lockfile:
    # CVE scan against the committed lockfile. verify-lockfile catches
    # "lockfile drift from pyproject"; this catches "pinned versions
    # themselves are known-vulnerable." Pairs with Dependabot: when a CVE
    # drops Dependabot opens the upgrade PR; pip-audit fails this job
    # until the upgrade lands (or the CVE is explicitly waived).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        # Pin to an exact version. Without this, a malicious pip-audit
        # release in the >=2.7,<3 range could silently report "no CVEs"
        # against the lockfile it's supposed to audit — closes the
        # bootstrap loop. Bump this pin (and verify the change against
        # the pip-audit changelog + GitHub release page) when Dependabot
        # opens a PR for it. The `pip install` here doesn't run with
        # --require-hashes because pip-audit isn't in our runtime
        # lockfile; the exact-version pin is the substitute control.
        run: pip install 'pip-audit==2.9.0'

      - name: Audit production lockfile
        # --strict so any vulnerability is a non-zero exit.
        # Waivers are inline --ignore-vuln (pip-audit has no config-file
        # support - verified v2.9.0). This set MUST stay in sync with
        # osv-scanner.toml's [[IgnoredVulns]]: both scanners audit the same
        # lockfiles and the same transitive mitmproxy CVEs, so a waiver in
        # one without the other is what lets this job go red while osv-scan
        # stays green.
        #   GHSA-cx3h-4qpv-8hc9  tornado OOB read, CVSS 3.7, transitive.
        #   GHSA-3x9g-8vmp-wqvf  tornado follow_redirects cred-forwarding;
        #                        N/A, AVP never follows redirects (architecture 4.2).
        #   GHSA-mgf9-4vpg-hj56  tornado CVSS 7.5, transitive.
        #   GHSA-pw6j-qg29-8w7f  tornado CVSS 5.9, transitive.
        #   GHSA-6v7p-g79w-8964  msgpack OOB read; AVP unpacks no untrusted msgpack.
        #   PYSEC-2026-3552/3/4  cryptography X.509-verify + PKCS#7-decrypt CVEs;
        #                        N/A, AVP only loads a PEM key + signs RS256/ES256
        #                        JWTs (never verifies chains / decrypts PKCS#7).
        #   GHSA-6hr6-w5qg-qmwg  h2 HTTP request smuggling (dup Host on HTTP/2
        #                        ->1.1 downgrade), CVSS 5.3, transitive; needs an
        #                        untrusted HTTP/2 client (AVP's client is local).
        # tornado fixes (6.5.6+) are blocked by mitmproxy's tornado<=6.5.5 pin,
        # msgpack 1.2.1 by its msgpack<=1.1.2 pin, cryptography 49/50 by its
        # cryptography<=48.1 pin, and h2 4.4.1 by mitmproxy's exact h2==4.3.0 pin;
        # drop each waiver when a mitmproxy release relaxes the pin and a
        # lockfile regen pulls the fix.
        run: >-
          pip-audit --strict --requirement requirements.lock
          --ignore-vuln GHSA-cx3h-4qpv-8hc9
          --ignore-vuln GHSA-3x9g-8vmp-wqvf
          --ignore-vuln GHSA-mgf9-4vpg-hj56
          --ignore-vuln GHSA-pw6j-qg29-8w7f
          --ignore-vuln GHSA-6v7p-g79w-8964
          --ignore-vuln PYSEC-2026-3552
          --ignore-vuln PYSEC-2026-3553
          --ignore-vuln PYSEC-2026-3554
          --ignore-vuln GHSA-6hr6-w5qg-qmwg

      - name: Audit dev lockfile
        # Dev-only CVEs (ruff, pytest, mypy) aren't shipped to users, but
        # they CAN compromise the CI runner that builds the wheel. Worth
        # gating on, can be waived per-CVE if a dev-only finding becomes
        # noisy and has no upstream fix yet.
        # requirements-dev.lock is a superset of requirements.lock, so it
        # inherits the same mitmproxy transitive waivers (kept in sync with
        # osv-scanner.toml and the production audit step above).
        run: >-
          pip-audit --strict --requirement requirements-dev.lock
          --ignore-vuln GHSA-cx3h-4qpv-8hc9
          --ignore-vuln GHSA-3x9g-8vmp-wqvf
          --ignore-vuln GHSA-mgf9-4vpg-hj56
          --ignore-vuln GHSA-pw6j-qg29-8w7f
          --ignore-vuln GHSA-6v7p-g79w-8964
          --ignore-vuln PYSEC-2026-3552
          --ignore-vuln PYSEC-2026-3553
          --ignore-vuln PYSEC-2026-3554
          --ignore-vuln GHSA-6hr6-w5qg-qmwg

  wheel-smoke:
    # Build the wheel and install it into a fresh venv. Catches the
    # class of bugs unit tests don't: missing files from the wheel,
    # entry-point misconfig, version skew between pyproject + __init__,
    # module-import-time failures that only surface against a clean
    # interpreter. Mirrors scripts/smoke-test-wheel.sh — same checks,
    # but no docker wrapper because the runner already provides
    # interpreter isolation.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: 'pip install --no-cache-dir --only-binary :all: build'

      - name: Build wheel
        run: python -m build --wheel --outdir dist .

      - name: Locate wheel
        id: locate
        run: |
          WHEEL=$(ls dist/keys_on_the_wire-*.whl | head -1)
          if [ -z "$WHEEL" ]; then
            echo "::error::No wheel produced under dist/"
            exit 1
          fi
          echo "wheel=$WHEEL" >> "$GITHUB_OUTPUT"
          echo "built: $WHEEL"

      - name: Read expected version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")
          echo "expected=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create fresh venv + install wheel
        # Fresh venv (not the runner's system Python) so the install
        # resolves ONLY the wheel-declared deps. Mirrors what a
        # downstream `pip install kow` would see.
        # WHEEL is bound via env: rather than interpolated directly into
        # the shell — zizmor template-injection guard, even though the
        # value comes from `ls dist/`-controlled output.
        env:
          WHEEL: ${{ steps.locate.outputs.wheel }}
        run: |
          python -m venv /tmp/smokevenv
          /tmp/smokevenv/bin/pip install --no-cache-dir --only-binary :all: "$WHEEL"

      - name: Assert import works
        run: /tmp/smokevenv/bin/python -c "import kow; print('import OK')"

      - name: Assert version matches pyproject
        # EXPECTED via env: rather than direct ${{ }} interpolation —
        # zizmor template-injection guard. Source is pyproject.toml,
        # not attacker-controllable, but the pattern-level fix is cheap.
        env:
          EXPECTED: ${{ steps.version.outputs.expected }}
        run: |
          ACTUAL=$(/tmp/smokevenv/bin/python -c "import kow; print(kow.__version__)")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::wheel reports $ACTUAL, pyproject.toml says $EXPECTED"
            exit 1
          fi
          echo "version OK: $ACTUAL"

      - name: Assert entry point loads
        # Verify the __main__ entry point and the addon module both
        # import without error. This catches any module-load-time bug
        # in addon.py / config.py / backends that escaped unit tests
        # (those run from the source tree; this runs against the
        # installed wheel, exercising the wheel's actual file layout).
        # Previously this step ran `python -m kow --help`
        # which delegates to mitmdump's argparse; mitmdump's behavior
        # on --help with a -s addon flag is fragile across versions and
        # was returning exit 1 on the runner. An import-only check is
        # what the smoke test actually needs.
        run: |
          /tmp/smokevenv/bin/python -c "
          import kow
          from kow.__main__ import main
          from kow import addon, config
          from kow.backends import BACKEND_REGISTRY
          assert 'bws' in BACKEND_REGISTRY, 'bws backend not registered'
          assert 'static' in BACKEND_REGISTRY, 'static backend not registered'
          print('entry point + addon + config + backends importable')
          "
