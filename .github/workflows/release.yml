name: release

# Triggers on `git push origin v0.4.0` (or any v* tag).
# Uses PyPI's trusted-publisher OIDC flow — no API token to store.
# Set up at https://pypi.org/manage/account/publishing/ once before the first
# release: project name = kow, owner = inflightsec,
# repository = kow, workflow = release.yml, env = pypi.

on:
  push:
    tags:
      - 'v*'
  # Allow manual re-runs from the Actions tab in case the publish step
  # transiently fails (PyPI hiccup, etc.).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      # Block unexpected outbound network from the runner.
      # Start in `audit` mode to collect the actual egress profile from a few
      # green runs, then flip to `block` with a concrete `allowed-endpoints`
      # list once the StepSecurity insights page shows what each job reaches.
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor: artipacked — don't leave credentials in .git/config that
          # could end up in uploaded artifacts.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify version matches tag
        # Reject the release if pyproject.toml version != git tag (minus the v).
        # Catches the "forgot to bump pyproject.toml" footgun before publishing.
        run: |
          TAG="${GITHUB_REF##*/}"     # refs/tags/v0.4.0 → v0.4.0
          TAG_VER="${TAG#v}"          # v0.4.0 → 0.4.0
          PROJECT_VER=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG_VER" != "$PROJECT_VER" ]; then
            echo "::error::Tag $TAG (=$TAG_VER) does not match pyproject.toml version $PROJECT_VER"
            exit 1
          fi
          echo "Version check passed: $TAG_VER"

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/keys-on-the-wire/
    permissions:
      # OIDC token for PyPI trusted publishing — no API token needed.
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          # Extract to the workspace `dist/` (the publish action's default).
          # The "extract outside workspace" artifact-overwrite defense
          # doesn't apply to this job: there's no `checkout` step here,
          # so a malicious archive has no workflow files to overwrite.
          # The publish action runs inside a Docker container that only
          # mounts the workspace, so a host path like /tmp/dist is
          # invisible to it (FileNotFoundError on the container side).
          path: dist/

      - name: Publish
        # SHA-pinned to a published ghcr.io image SHA, NOT to the v1.14.0
        # release-tag SHA. pypa/gh-action-pypi-publish v1.x is a composite
        # action that generates an inner Docker action referencing
        # `ghcr.io/pypa/gh-action-pypi-publish:${{ github.action_ref }}`.
        # ghcr.io only publishes images for build SHAs from the unstable/v1
        # branch (plus version-tag aliases like `v1.14.0`). The v1.14.0
        # release-tag SHA (6733eb7d...) has no ghcr.io image — pinning
        # to it produces `manifest unknown` at runtime.
        # ba38be9e... is a build SHA from unstable/v1 that ghcr.io DOES
        # publish, and that image is the same content as v1.14.0 (a
        # setup-python build-dep bump merged after the v1.14.0 tag).
        # `pinact` ignores this entry via .pinact.yaml so it doesn't
        # "helpfully" rewrite this back to the broken release-tag SHA.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (ghcr.io build SHA) — Twine v7, accepts core-metadata 2.5
        with:
          packages-dir: dist/

  pypi-install-smoke:
    name: PyPI install smoke (post-publish)
    needs: publish-pypi
    runs-on: ubuntu-latest
    # Read-only is sufficient: this job only reads the repo (to access
    # tests/pypi-smoke/) and pulls public images from registries.
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for PyPI CDN to propagate
        # The publish step returns success the moment Warehouse accepts
        # the upload, but the CDN that pip resolves against can take
        # 30-120s before the new version becomes visible to a fresh
        # client. Without this wait, the smoke racy-fails with "No
        # matching distribution found for keys-on-the-wire==X.Y.Z".
        # 120s covers the long tail; shorter is flakier.
        run: sleep 120

      - name: Extract release version from tag
        # refs/tags/v0.4.1 → 0.4.1 (no leading v). The smoke script
        # accepts both shapes but we normalise here for clarity in logs.
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Smoking keys-on-the-wire==$VERSION from real PyPI"

      - name: Run PyPI smoke harness against real PyPI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash tests/pypi-smoke/run.sh "$VERSION"

      # On failure, the workflow goes red and `github-release` (which
      # depends on this job) doesn't run. The published PyPI version is
      # already irreversible at this point — the operator needs to yank
      # it manually via `pypi-cli yank` or the PyPI web UI. Better to
      # have a yanked version than a broken Release.

  github-release:
    name: Create GitHub Release
    needs: pypi-install-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor: artipacked — don't leave credentials in .git/config that
          # could end up in uploaded artifacts.
          persist-credentials: false

      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: /tmp/dist/   # extract outside the workspace (artifact-overwrite defense)

      - name: Extract changelog section for this tag
        # Pulls the matching `## [X.Y.Z]` section out of CHANGELOG.md so the
        # GitHub release body matches the changelog without manual copy-paste.
        run: |
          TAG="${GITHUB_REF##*/}"
          TAG_VER="${TAG#v}"
          # Print lines between `## [X.Y.Z]` and the next `## [` heading.
          awk -v ver="$TAG_VER" '
            $0 ~ "^## \\[" ver "\\]" { capturing=1; next }
            capturing && /^## \[/ { exit }
            capturing { print }
          ' CHANGELOG.md > release-notes.md
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create release
        # Use the runner-provided `gh` CLI instead of a third-party action —
        # one fewer external dep to trust + audit (zizmor: superfluous-actions).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            /tmp/dist/*
