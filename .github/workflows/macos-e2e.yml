name: macos-e2e

# The macOS end-to-end legs, on both architectures. These run the SAME scripts a
# contributor runs on their own Mac (`bash tests/vm-e2e/macos-e2e.sh`), on
# ephemeral machines Apple licenses to GitHub — so the privileged leg, which
# creates a service account and a LaunchDaemon, runs continuously without asking
# anyone to hand their laptop over.
#
# Both labels are Apple Silicon (/opt/homebrew). macos-13 — GitHub's last FREE
# Intel runner — is retired: it publishes no runner images any more and jobs
# targeting it queue until the concurrency group cancels them. Twelve runs here
# never produced a single macos-13 result.
#
# So the Intel prefix (/usr/local), which is exactly what the Apple Silicon
# prefix bug hinged on, is NOT covered by CI. Intel now needs a paid `-large`
# runner. It is covered instead by `tests/vm-e2e/run-macos.sh` against a local
# Intel VM, which reports prefix=/usr/local. If Intel regressions start
# mattering commercially, that is the gap to buy coverage for.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Zero-privilege leg: no sudo, everything under a scratch dir, nothing left
  # behind. This is the one a contributor is expected to run locally.
  unprivileged:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # step-security/harden-runner is Linux-only, so these jobs run with NO egress
    # guard — unlike the Linux jobs in test.yml. Network access is whatever the
    # runner image, setup-python, pip and Homebrew make; it is not constrained
    # here. Treat that as a known gap, not a property.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Report the prefix this runner actually uses
        run: |
          echo "arch=$(uname -m)  brew prefix=$(brew --prefix)"

      - name: Unprivileged macOS e2e
        run: bash tests/vm-e2e/macos-e2e.sh

  # The keychain backend against the REAL /usr/bin/security. The unit suite runs
  # on Linux against a fake `security`, so everything only the actual tool can
  # answer — the interactive quoting protocol, exit 44 for item-not-found,
  # enumeration without a prompt, locked-keychain behaviour — is answered here.
  #
  # Unprivileged, and not by accident: a keychain belongs to a login session, so
  # this leg running as the calling user IS the LaunchAgent constraint. It builds
  # a throwaway keychain, never touches the login keychain, and deletes it on
  # exit. Runs on PRs for that reason — there is nothing to consent to.
  keychain:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Keychain backend macOS e2e (throwaway keychain, real security(1))
        run: bash tests/vm-e2e/macos-e2e.sh --keychain

  # kow-keyd: does the signed helper actually scope keychain access to kow
  # rather than to the Python interpreter? Builds the helper from source with a
  # throwaway self-signed identity, then asserts that security(1) and a Python
  # script are BOTH refused while the helper reads its own item. Needs no
  # secrets and no Developer ID — that is the point of the self-signed path.
  keyd:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: kow-keyd e2e (signed helper scopes the ACL)
        run: bash tests/vm-e2e/macos-keyd-e2e.sh

  # The documented system install: dscl service account, LaunchDaemon,
  # append-only audit log. Safe here precisely because the runner is thrown away
  # afterwards; the script still tears everything down and reports residue.
  system:
    # NOT on pull_request: this leg runs a sudo-capable install, and a PR (from a
    # fork especially) is untrusted code. The unprivileged leg above covers PRs.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: System macOS e2e (install, assert, tear down)
        env:
          KOW_E2E_CONSENT: '1'
        run: bash tests/vm-e2e/macos-e2e.sh --system

  # The real tap formula, built from source. Slow (~15 min), so it is not on the
  # push path — run it from the Actions tab when the formula or packaging changes.
  brew:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout the tap (the formula under test)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: inflightsec/homebrew-keys-on-the-wire
          path: tap
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Homebrew formula e2e
        env:
          KOW_SRC: ${{ github.workspace }}
          KOW_FORMULA: ${{ github.workspace }}/tap/Formula/keys-on-the-wire.rb
        run: bash tests/vm-e2e/guest-brew.sh
