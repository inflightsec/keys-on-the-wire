# Auto-discovered by the pre-commit docker hook and the CI osv-scan job.
#
# All ignored CVEs are in TRANSITIVE deps of mitmproxy (tornado, msgpack, h2,
# and cryptography's cert-verify / PKCS#7-decrypt paths), not in AVP's
# credential-injection path. They are suppressed only because the fix is not
# yet installable — never to silence an applicable, fixable issue.

# --- tornado: pinned by mitmproxy at tornado<=6.5.5,>=6.5.0 ------------------
# tornado 6.5.6+ (the fixes) CANNOT be installed until mitmproxy ships a
# release that relaxes the <=6.5.5 pin (mitmproxy 12.2.3, 2026-05-12, is both
# current and the newest on PyPI). tornado is used by mitmproxy's web UI/master,
# not AVP's request path, and kow never starts mitmweb.
#
# A `[tool.uv] override-dependencies = ["tornado>=6.5.8"]` was tried on
# 2026-09-06 and reverted the same day. uv honours it, pip does not: CI's
# `pip install --require-hashes` dies with ResolutionImpossible, and because the
# wheel only declares mitmproxy>=11.0 an end user's pip picks 6.5.5 anyway. It
# would have greened the scanners without making one install safer.
#
# Drop all seven when a mitmproxy release allows tornado>=6.5.6 and a regen
# pulls it.

