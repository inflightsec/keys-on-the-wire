# Pre-commit hooks — install once with `pre-commit install`, then they run
# on every commit. CI runs the same set, so passing pre-commit locally means
# CI won't complain about the same things.
#
# Keep hook versions current:
#   pre-commit autoupdate
#
# Refs are git tags (not SHAs) for readability. Pre-commit clones the hook
# repo into a local cache the first time and runs from that — the threat
# model is the operator's local machine, not the public CI runner.

default_language_version:
  # Use whatever python3 is on the contributor's PATH. pyproject.toml
  # requires-python = ">=3.12" so anything >= 3.12 satisfies the
  # project's runtime contract. Pinning to a specific minor (e.g.
  # python3.12) here forces every contributor to install that exact
  # interpreter just to run pre-commit, even though only bandit
  # actually needs a Python interpreter — ruff, zizmor are Rust
  # binaries and the rest are `language: system` shells. CI still
  # gates against the 3.12 + 3.13 matrix in test.yml.
  python: python3

repos:
  # ─── Hygiene: file-level checks that catch sloppy commits ─────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # GH Actions workflow files use a YAML `on:` key, which check-yaml
        # parses as the keyword `True` and warns about. Workflows are covered
        # by zizmor + actionlint; skip them here.
        exclude: '^\.github/workflows/'
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
        # Trips on obviously-fake PEM fixtures: test_cli_doctor's
        # ("SECRET"/"DEADBEEF" bodies), and the truncated 3-line fragments of
        # the public jwt.io sample key used by the multi-line-secret tests
        # (--stdin-raw / kow-keyd, ADR-0051). None is a loadable key; real-key
        # detection for the repo is TruffleHog's job (verified-only scan).
        # docs/keychain-helper.md quotes the bare PEM header LINE in prose
        # (explaining what --stdin would truncate to); the hook matches the
        # substring anywhere, so the sentence cannot name the line verbatim
        # without tripping it. No key material of any kind in that file.
        exclude: '^(tests/(test_cli_doctor\.py|cli/test_secret\.py|backends/test_keychain_helper\.py|vm-e2e/macos-keyd-e2e\.sh)|docs/keychain-helper\.md)$'

  # ─── Ruff: lint + format. Single source of truth, mirrors CI. ─────────
  # Pinned to the ruff in requirements-dev.lock (0.15.21) so the local
  # pre-commit format gate and the CI `ruff format --check` are in byte
  # agreement — a stale rev here reformats files CI then rejects (and vice versa).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ─── Bandit: Python-specific SAST (catches eval, hardcoded secrets,
  #     yaml.load instead of safe_load, subprocess with shell=True, etc.) ─
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['--quiet', '--configfile', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
        # Test fixtures use real-looking placeholder strings; bandit's
        # hardcoded-password heuristic trips on them. Skip tests/.
        exclude: '^tests/'

  # ─── Zizmor: security audit of .github/workflows/ files ──────────────
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.25.2
    hooks:
      - id: zizmor

  # Note: pinact does not ship `.pre-commit-hooks.yaml` at any tag (verified
  # 2026-05-31), so the canonical `repo: https://github.com/suzuki-shunsuke/pinact`
  # ref errors with InvalidManifestError on first install. Pinact's *detection*
  # overlaps ~entirely with zizmor's `unpinned-uses` audit rule above, but its
  # *auto-fix* (rewriting `@v1` → `@<sha> # v1`) is unique. We invoke pinact
  # as a local hook (see precommit-pinact.sh below) so contributors who have
  # it installed get the redundant check; everyone else gets zizmor's coverage.

  # ─── Local hooks (use already-installed tools, no external pin) ──────
  # mypy + pytest run from the project venv at .venv/bin/<tool>. We do
  # NOT use `language: python` (which would have pre-commit build its
  # own venv and pip-install our deps from PyPI) because:
  #   1. pre-commit's hook venvs ignore our locked --hash-pinned requirements;
  #   2. they'd need network on every fresh clone;
  #   3. they'd drift from CI, which uses .venv via `uv pip sync`.
  # The .venv path is the authoritative source — same interpreter used
  # for development and the same one CI sets up.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (static type check on src/)
        entry: .venv/bin/mypy --config-file pyproject.toml src
        language: system
        pass_filenames: false
        # Type-check on every Python change. Catches Optional handling,
        # type signature drift, return-from-Any at third-party boundaries
        # that ruff doesn't see.
        files: '^src/.*\.py$'
        types: [python]

      - id: pytest
        name: pytest (unit tests must pass)
        # An explicit -m REPLACES pyproject addopts' -m "not docker" (single-value
        # option, CLI wins), so "not specs" alone silently re-enabled the docker
        # e2e on every commit — the exact per-commit cost pre-release.sh exists
        # to avoid. Keep BOTH exclusions in one expression. (2026-10-11, found
        # when the e2e's token-mock broke a release commit on mainframe.)
        entry: .venv/bin/pytest -q --strict-markers --strict-config -m "not specs and not docker"
        language: system
        pass_filenames: false
        # Only run when src/ or tests/ changed — skip on doc-only commits.
        # `-m "not specs"`: the ADR-0054 Quint conformance battery shells out
        # to the quint CLI (~30s) — CI's specs.yml is its enforcement gate,
        # commits stay fast. Run locally with: pytest -m specs
        files: '\.(py)$'
        types: [python]

      - id: lockfile-hashes
        name: lockfile hash-pinning (every package must have --hash=sha256:)
        entry: python3 scripts/check-lockfile-hashes.py
        language: system
        pass_filenames: false
        # Run on every commit — it's cheap (no network, ~10ms) and catches
        # hand-edited lockfiles or pip-compile runs that forgot --generate-hashes.
        files: '^(requirements(-dev)?\.lock|scripts/check-lockfile-hashes\.py)$'

      - id: lockfile-drift
        name: lockfile drift (pyproject.toml ↔ lockfile must match)
        entry: bash scripts/check-lockfile-drift.sh
        language: system
        pass_filenames: false
        # Heavier: re-runs `uv pip compile` with the 7-day cooldown and diffs.
        # Mirrors the verify-lockfile CI job; runs locally for fast feedback
        # whenever pyproject.toml or a lockfile changed. Silently skips if uv
        # isn't installed (CI is the enforcement gate).
        files: '^(pyproject\.toml|requirements(-dev)?\.lock|scripts/check-lockfile-drift\.sh)$'

      - id: lockfile-drift-push
        name: lockfile drift (pre-push, unconditional)
        entry: bash scripts/check-lockfile-drift.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
        # The commit-stage hook above scopes via `files:` to skip on code/doc
        # commits — fast feedback when deps change. But drift is calendar-based
        # (the 7-day cooldown rolls forward at midnight UTC), so a clean commit
        # today can hit CI tomorrow and fail. This pre-push variant runs every
        # push regardless of touched paths, catching time-based drift before it
        # reaches CI. Install both stages with `pre-commit install --hook-type
        # pre-commit --hook-type pre-push`.

      - id: version-alignment
        name: version alignment (all version literals ↔ pyproject.toml)
        entry: bash scripts/check-version-alignment.sh
        language: system
        pass_filenames: false
        # Cheap (~20ms, no network). Fires whenever a version-bearing file
        # changes so a manual bump that touches pyproject.toml but forgets a
        # sibling literal (docker-compose image, __init__ __version__, a README
        # pin) is caught at commit time — not at pre-release. v0.4.2 shipped and
        # 0.9.0 nearly shipped with exactly this skew. Shares one definition of
        # "aligned" with pre-release.sh (both call check-version-alignment.sh).
        files: '^(pyproject\.toml|src/kow/__init__\.py|README\.md|docker-compose\.yml|scripts/check-version-alignment\.sh)$'

      - id: token-egress-chokepoint
        name: token egress chokepoint (ADR-0035 — one SSRF-pinned transport)
        entry: bash scripts/check-token-egress-chokepoint.sh
        language: system
        pass_filenames: false
        # Cheap grep (no network). Fails if any injector opens a raw
        # urllib/http.client/socket connection outside the shared, SSRF-pinned
        # transport (injectors/_token_transport.py) — which would reintroduce
        # the check→connect TOCTOU ADR-0035 closed. Scoped to the injectors dir
        # and the guard script itself.
        files: '^(src/kow/injectors/.*\.py|scripts/check-token-egress-chokepoint\.sh)$'

      # ─── Heavy security tools — mirror security.yml CI jobs ───────────
      # The Docker-based tools below gracefully skip if docker not on PATH;
      # trufflehog runs a native version-pinned binary (no container tax).
      # Scoped to relevant file patterns so most commits stay fast.

      - id: trufflehog
        name: TruffleHog (secret scan over diff)
        entry: bash scripts/precommit-trufflehog.sh
        language: system
        pass_filenames: false
        # Always run — every commit could introduce a secret. Native pinned
        # binary keeps it fast; skips with install guidance if not present.

      - id: osv-scanner
        name: OSV-Scanner (CVE check on lockfiles)
        entry: bash scripts/precommit-osv.sh
        language: system
        pass_filenames: false
        # Only run when something dep-relevant changed. Skips pure code/
        # doc commits entirely.
        files: '^(pyproject\.toml|requirements(-dev)?\.lock|scripts/precommit-osv\.sh)$'

      - id: semgrep
        name: Semgrep (pattern SAST on src/)
        entry: bash scripts/precommit-semgrep.sh
        language: system
        pass_filenames: false
        # Only run on src/ Python changes — keeps doc-only commits fast.
        # CI runs this too as the authoritative gate.
        files: '^src/.*\.py$|^scripts/precommit-semgrep\.sh$'

      - id: quint-specs
        name: Quint spec typecheck (ADR-0054 models)
        entry: bash scripts/precommit-quint.sh
        language: system
        pass_filenames: false
        # Parse + typecheck only (~2s, no JVM) so a syntax error in a model
        # never lands. The full battery — fixture conformance, gate
        # invariants, rotation safety — is tests/test_spec_conformance.py
        # (runs with the pytest hook when the quint CLI is present, and
        # unconditionally in CI's specs job via KOW_REQUIRE_QUINT=1).
        files: '^(specs/.*\.qnt|scripts/precommit-quint\.sh)$'

      - id: pinact
        name: pinact (--check SHA-pinning of action refs)
        entry: bash scripts/precommit-pinact.sh
        language: system
        pass_filenames: false
        # Only run when a workflow file or this hook script changed.
        # Skips gracefully if the pinact binary isn't on PATH — install
        # via `aqua install pinact` if you want this enforced locally.
        files: '^(\.github/workflows/.*\.ya?ml|scripts/precommit-pinact\.sh)$'
